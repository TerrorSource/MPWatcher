name: Build and push Docker image

on:
  push:
    branches: ["main"]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Bij een release wordt naast :latest ook een versie-tag gepusht (bijv. :v18).
          tags: |
            ghcr.io/terrorsource/mpwatcher:latest
            ghcr.io/terrorsource/mpwatcher:${{ github.sha }}
            ${{ github.event_name == 'release' && format('ghcr.io/terrorsource/mpwatcher:{0}', github.event.release.tag_name) || '' }}
