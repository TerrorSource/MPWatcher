name: Build and push Docker image

on:
  push:
    branches: ["main"]
  release:
    types: [published]

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # mpwatchter:latest (oude typo-naam) blijft tijdelijk meegepusht zodat
          # bestaande deployments updates krijgen; verwijderen zodra alles over is.
          # Bij een release wordt daarnaast een versie-tag gepusht (bijv. :v18).
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/mpwatcher:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/mpwatcher:${{ github.sha }}
            ${{ secrets.DOCKERHUB_USERNAME }}/mpwatchter:latest
            ${{ github.event_name == 'release' && format('{0}/mpwatcher:{1}', secrets.DOCKERHUB_USERNAME, github.event.release.tag_name) || '' }}
